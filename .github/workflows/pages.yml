# Builds the showcase site (site/ plus the real wallpaper page playing a made-up session) and publishes it to
# GitHub Pages. tools/build_site.py needs only Python's standard library. Runs on GitHub only: the repo also lives
# on a Forgejo server that mirrors here, and this must not run there.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/glitchwall/wallpaper/**"
      - "src/glitchwall/demo.py"
      - "src/glitchwall/ambient.py"
      - "src/glitchwall/redact.py"
      - "tools/build_site.py"
      - "docs/shots/**"
      - "docs/gifs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the site
        run: python3 tools/build_site.py _site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write    # publish the site
      id-token: write # prove the artifact came from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
