[package]
name = "glitchwall-render"
version = "0.1.0"
edition = "2024"
description = "glitchwall's native wallpaper renderer for Windows: Direct2D behind the desktop icons, fed by glitchwall's feed"
license = "MIT"
publish = false

[dependencies]
# the redaction's patterns lean on lookarounds, which the plain regex crate leaves out
fancy-regex = "0.14"
# 0.58: the last version that brings its own import libraries, so the GNU toolchain needs nothing else (see PLAN.md)
windows = { version = "0.58", features = [
    "Foundation_Numerics",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
