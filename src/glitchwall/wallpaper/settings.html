<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>glitchwall settings</title>
<link rel="icon" href="glitchwall.png">
<style>
  /* A green phosphor terminal: glowing green lines and type on black glass, amber for anything paused. All fonts bundled. */
  @font-face { font-family:'Departure Mono'; src:url('DepartureMono-Regular.otf') format('opentype'); font-display:block; }
  @font-face { font-family:'VT323'; src:url('fonts/VT323-Regular.ttf'); font-display:block; }
  :root {
    --bg:#010401; --glass:#031008; --ph:#5dff7a; --ph-hi:#c8ffd0; --ph-dim:#2c8f41; --ph-line:rgba(93,255,122,.3); --ph-faint:rgba(93,255,122,.12);
    --glow:0 0 5px rgba(93,255,122,.6); --amber:#ffb000; --red:#ff5a4a;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ph-dim); font:12px/1.4 'Departure Mono', Consolas, monospace; }
  body { display:grid; grid-template-rows:auto minmax(0,1fr) auto; height:100vh; overflow:hidden;
         background:radial-gradient(120% 100% at 50% 35%, #03140a, var(--bg) 75%); }
  body::after { content:''; position:fixed; inset:0; pointer-events:none; z-index:50;   /* scanlines over the whole tube */
                background:repeating-linear-gradient(transparent 0 2px, rgba(0,0,0,.18) 2px 3px); }
  button { font:inherit; color:inherit; }
  .tag { font-size:10px; letter-spacing:.22em; color:var(--ph); text-shadow:var(--glow); }
  .tag::before { content:'> '; color:var(--ph-dim); text-shadow:none; }

  /* ---------- header: name, status lamps, sound, the pause key */
  header { display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px; padding:10px 14px; border-bottom:1px solid var(--ph-line); }
  .brand { font:21px/1 'Departure Mono', monospace; letter-spacing:.4em; color:var(--ph); text-shadow:var(--glow), 0 0 16px rgba(93,255,122,.3); }
  .brand small { display:block; font-size:9px; letter-spacing:.3em; color:var(--ph-dim); margin-top:5px; text-shadow:none; }
  .brand .cur { display:inline-block; width:.55em; height:.9em; margin-left:.1em; vertical-align:-2px; background:var(--ph); box-shadow:var(--glow); animation:blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  .status { display:flex; gap:18px; }
  .ind { display:flex; align-items:center; gap:7px; font-size:10px; letter-spacing:.15em; }
  .led { width:9px; height:9px; border-radius:50%; flex:none; border:1px solid var(--ph-dim); background:transparent; transition:background .15s, box-shadow .15s, border-color .15s; }
  .led.g { background:var(--ph); border-color:var(--ph); box-shadow:0 0 6px var(--ph); }
  .led.a { background:var(--amber); border-color:var(--amber); box-shadow:0 0 6px var(--amber); }
  .led.r { background:var(--red); border-color:var(--red); box-shadow:0 0 6px var(--red); }
  .grow { flex:1; }
  #snd { display:flex; align-items:center; gap:7px; background:none; border:1px solid var(--ph-line); cursor:pointer; font-size:10px; letter-spacing:.15em; padding:6px 10px; border-radius:3px; }
  #resetall { display:flex; align-items:center; gap:7px; background:none; border:1px solid var(--ph-line); cursor:pointer; font-size:10px; letter-spacing:.15em; padding:6px 10px; border-radius:3px; }
  #resetall.armed { color:var(--amber); border-color:var(--amber); box-shadow:0 0 8px rgba(255,176,0,.5); text-shadow:0 0 5px rgba(255,176,0,.6); }
  #resetall:focus-visible { outline:1px dashed var(--ph-hi); outline-offset:3px; }
  #pause { display:flex; align-items:center; gap:12px; background:none; border:1px solid var(--ph); cursor:pointer; padding:5px 14px 5px 6px; border-radius:3px; box-shadow:var(--glow); }
  #pause .cap { width:30px; height:30px; display:grid; place-items:center; font-size:14px; color:var(--bg); background:var(--ph); border-radius:2px; box-shadow:var(--glow); }
  #pause .t { text-align:left; font-size:11px; letter-spacing:.2em; color:var(--ph); text-shadow:var(--glow); }
  #pause .t small { display:block; font-size:9px; letter-spacing:.12em; color:var(--ph-dim); text-shadow:none; }
  #pause:active { transform:translateY(1px); }
  #pause.on { border-color:var(--amber); box-shadow:0 0 8px rgba(255,176,0,.6); }
  #pause.on .cap { background:var(--amber); box-shadow:0 0 8px var(--amber); }
  #pause.on .t { color:var(--amber); text-shadow:0 0 5px rgba(255,176,0,.6); }

  /* one compact column: the wallpaper itself is the preview, so this window only needs the controls */
  main { display:flex; flex-direction:column; gap:10px; padding:10px 12px; min-height:0; overflow:auto; }
  .side { display:flex; flex-direction:column; gap:10px; min-width:0; }
  /* the readout keeps one height whatever it says, so nothing below it ever jumps */
  #readout { order:-1; height:112px; }
  #readout .l2 { display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; overflow:hidden; }
  #pause { min-width:178px; }
  .drum.still .item { transition:none; }   /* the first placement: straight into position, no pile-up */
  footer { gap:4px 14px !important; padding:6px 14px !important; }
  main > *, .side > * { flex-shrink:0; }   /* never squash a module: scroll instead */
  #motion { flex:1; min-height:0; display:flex; flex-direction:column; }
  .mod { position:relative; min-width:0; border:1px solid var(--ph-line); border-radius:4px; padding:24px 12px 12px; background:rgba(3,16,8,.55); }
  .mod > h2 { position:absolute; top:7px; left:11px; margin:0; font-weight:400; }
  /* a module's DEFAULT key, top right; lit only when something in it differs from the default */
  .reset { position:absolute; top:4px; right:8px; padding:1px 7px; font-size:9px; letter-spacing:.14em; cursor:pointer;
           background:none; border:1px solid var(--ph-line); border-radius:2px; color:var(--ph-dim); opacity:.45; }
  .reset.live { opacity:1; color:var(--ph); border-color:var(--ph); text-shadow:var(--glow); }
  .reset.live:hover { background:rgba(93,255,122,.12); }
  .reset:focus-visible { outline:1px dashed var(--ph-hi); outline-offset:2px; }
  /* a control that differs from its default gets a mark by its name */
  .changed .name::after { content:' *'; color:var(--ph); text-shadow:var(--glow); }


  /* the readout: what the control under the mouse or keyboard does */
  #readout { min-width:0; min-height:0; overflow:hidden; color:var(--ph); text-shadow:var(--glow); }
  #readout .l1 { font:22px/1 'VT323', monospace; letter-spacing:.08em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #readout .l1::before { content:'$ '; color:var(--ph-dim); }
  #readout .l2 { font:18px/1.15 'VT323', monospace; margin-top:7px; color:var(--ph-dim); text-shadow:none; overflow-wrap:anywhere; }
  #readout .err { color:var(--red); }

  /* switches: a slide toggle that lights when on */
  #priv { grid-area:priv; }
  .switches { display:flex; gap:8px; }
  .sw { flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:6px; padding:3px 2px; border-radius:3px; cursor:pointer; background:none; border:0; }
  .sw .slot { position:relative; width:40px; height:20px; border-radius:10px; border:1px solid var(--ph-dim); }
  .sw .lever { position:absolute; top:3px; left:3px; width:12px; height:12px; border-radius:50%; background:var(--ph-dim); transition:left .12s, background .12s, box-shadow .12s; }
  .sw.on .slot { border-color:var(--ph); box-shadow:var(--glow); }
  .sw.on .lever { left:23px; background:var(--ph); box-shadow:0 0 6px var(--ph); }
  .sw .name { font-size:9px; letter-spacing:.12em; text-align:center; white-space:nowrap; }
  .sw.on .name { color:var(--ph); text-shadow:var(--glow); }
  .labelrow { display:flex; gap:10px; align-items:center; margin-top:10px; }
  .labelrow label { font-size:9px; letter-spacing:.15em; }
  #label { flex:1; min-width:0; padding:3px 8px; font:19px 'VT323', monospace; color:var(--ph); background:transparent; border:1px solid var(--ph-line); border-radius:2px; outline:none; text-shadow:var(--glow); }
  #label:focus { border-color:var(--ph); box-shadow:var(--glow); }

  /* selectors: the setting in a window, ridges beside it that roll as it turns */
  .knobs { display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:6px; }
  .knob { display:flex; flex-direction:column; align-items:center; gap:6px; background:none; border:0; padding:3px 0; cursor:ns-resize; border-radius:3px; min-width:0; }
  .rotor { display:flex; gap:3px; width:100%; height:44px; }
  .win { flex:1; min-width:0; display:grid; place-items:center; overflow:hidden; padding:0 3px; border:1px solid var(--ph-line); border-radius:2px; background:var(--glass); }
  .win .val { display:block; max-width:100%; text-align:center; font:18px 'VT323', monospace; color:var(--ph); text-shadow:var(--glow); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .wheel { width:8px; border:1px solid var(--ph-dim); border-radius:2px; transition:background-position .18s;
           background:repeating-linear-gradient(180deg, var(--ph-dim) 0 1px, transparent 1px 5px); }
  .knob .name { font-size:9px; letter-spacing:.12em; }

  /* the theme drum, turning left to right */
  .drum { position:relative; height:54px; overflow:hidden; cursor:ew-resize; touch-action:none; border:1px solid var(--ph-line); border-radius:2px; background:var(--glass); }
  .drum .window { position:absolute; left:50%; top:6px; bottom:6px; width:132px; margin-left:-66px; border:1px solid var(--ph); box-shadow:var(--glow); }
  .drum .item { position:absolute; left:50%; top:0; height:100%; width:124px; margin-left:-62px; display:grid; place-items:center;
                font:22px 'VT323', monospace; letter-spacing:.06em; color:var(--ph-dim); white-space:nowrap; transition:transform .22s, opacity .22s; }
  .drum .item.sel { color:var(--ph); text-shadow:var(--glow); }
  .drum::after { content:''; position:absolute; inset:0; pointer-events:none; background:linear-gradient(90deg, var(--glass), transparent 32%, transparent 68%, var(--glass)); }
  .drumfoot { display:flex; justify-content:space-between; margin-top:6px; font:16px/1 'VT323', monospace; }

  /* faders, lying flat, spread over the module's height */
  .faders { flex:1; display:flex; flex-direction:column; justify-content:space-evenly; gap:4px; }
  .fader { display:grid; grid-template-columns:64px minmax(0,1fr) 34px; align-items:center; gap:10px; padding:1px 3px; border-radius:3px; }
  .fader .name { font-size:9px; letter-spacing:.12em; }
  .fader .val { text-align:center; font:18px/1.15 'VT323', monospace; color:var(--ph); text-shadow:var(--glow); border:1px solid var(--ph-line); border-radius:2px; }
  .track { position:relative; height:20px; touch-action:none; cursor:ew-resize; }
  .track .ticks { position:absolute; inset:0 4px; background:repeating-linear-gradient(90deg, var(--ph-faint) 0 1px, transparent 1px 10%);
                  -webkit-mask:linear-gradient(#000 0 5px, transparent 5px 15px, #000 15px); mask:linear-gradient(#000 0 5px, transparent 5px 15px, #000 15px); }
  .track .slotv { position:absolute; left:4px; right:4px; top:9px; height:2px; background:var(--ph-dim); }
  .track .capf { position:absolute; top:2px; width:10px; height:16px; margin-left:-5px; background:var(--ph); border-radius:1px; box-shadow:0 0 6px var(--ph); }

  .sw:focus-visible, .knob:focus-visible, .fader:focus-visible, #pause:focus-visible, #snd:focus-visible, .drum:focus-visible { outline:1px dashed var(--ph-hi); outline-offset:3px; }
  .knob:hover .win, .fader:hover .val, .sw:hover .slot { border-color:var(--ph); }
  :focus { outline:none; }

  /* the key legend */
  footer { display:flex; flex-wrap:wrap; gap:6px 18px; padding:7px 16px; border-top:1px solid var(--ph-line); font-size:10px; letter-spacing:.05em; }
  kbd { display:inline-block; min-width:18px; padding:0 4px; margin-right:4px; text-align:center; font:10px/16px 'Departure Mono', monospace; color:var(--ph); border:1px solid var(--ph-dim); border-radius:2px; }

</style>
</head>
<body>
<header>
  <div class="brand">GLITCHWALL<span class="cur"></span><small>SETTINGS TERMINAL</small></div>
  <div class="status">
    <div class="ind"><span class="led" id="led-feed"></span>FEED</div>
    <div class="ind"><span class="led" id="led-air"></span><span id="air">ON AIR</span></div>
  </div>
  <span class="grow"></span>
  <button id="resetall" data-help="resetall"><span class="led" id="led-reset"></span><span id="resetall-t">RESET ALL</span></button>
  <button id="snd" data-help="sound"><span class="led" id="led-snd"></span>SOUND</button>
  <button id="pause" data-help="pause"><span class="cap">P</span><span class="t"><b id="pause-t">PAUSE</b><small id="pause-s">STREAM-SAFE</small></span></button>
</header>

<main>
  <div class="side">
    <div class="mod"><h2 class="tag">SELECT</h2><button class="reset" data-group="select" data-help="reset:select">DEFAULT</button><div class="knobs" id="knobs"></div></div>
    <div class="mod"><h2 class="tag">THEME</h2>
      <div class="drum" id="drum" tabindex="0" data-help="theme" role="listbox" aria-label="theme"><div class="window"></div></div>
      <div class="drumfoot"><span>&lt; TURN &gt;</span><span id="drumpos">--</span></div>
    </div>
    <div class="mod" id="motion"><h2 class="tag">MOTION</h2><button class="reset" data-group="motion" data-help="reset:motion">DEFAULT</button><div class="faders" id="faders"></div></div>
  </div>

  <div class="mod" id="readout" aria-live="polite"><div class="l1">CONNECTING…</div><div class="l2"></div></div>
  <div class="mod" id="priv"><h2 class="tag">PRIVACY</h2><button class="reset" data-group="privacy" data-help="reset:privacy">DEFAULT</button>
    <div class="switches" id="switches"></div>
    <div class="labelrow"><label for="label">LABEL</label><input id="label" maxlength="80" spellcheck="false" data-help="label"></div>
  </div>
</main>

<footer>
  <span><kbd>TAB</kbd>next control</span>
  <span><kbd>←</kbd><kbd>→</kbd>turn the theme · slide a fader</span>
  <span><kbd>↑</kbd><kbd>↓</kbd>change a setting</span>
  <span><kbd>SPACE</kbd><kbd>ENTER</kbd>press · flip</span>
  <span><kbd>BKSP</kbd>back to default</span>
  <span><kbd>P</kbd>pause / resume</span>
  <span><kbd>M</kbd>sound</span>
</footer>

<script>
const KEY = decodeURIComponent(location.hash.startsWith('#key=') ? location.hash.slice(5) : '');
const API = `/settings?key=${encodeURIComponent(KEY)}`;
const $ = id => document.getElementById(id);
const KNOBS = [['mode', 'MODE'], ['palette', 'COLORS'], ['rain', 'BACKDROP'], ['font', 'FONT'], ['transition', 'ARRIVAL']];
const FADERS = {
  type_speed: ['TYPING', 'How fast each call types itself out: 1 is a slow crawl, 20 is nearly instant.'],
  linger: ['LINGER', 'Seconds a card stays on screen after it finishes.'],
  cards: ['CARDS', 'How many cards share the screen at once.'],
  intensity: ['MOTION', 'How busy the background is: 0 holds it still, 10 is full motion.'],
  glass: ['GLASS', 'Card opacity: low lets the background show through, high is solid.'],
};
const SWITCHES = {
  commands_only: ['CALLS ONLY', 'Show each call, never its output.'],
  mask_user: ['MASK USER', 'Your user name shows as "user" everywhere.'],
  mask_email: ['MASK EMAIL', 'Email addresses lose everything before the @.'],
};
const KNOB_HELP = { mode: 'MODE', palette: 'COLORS', rain: 'BACKGROUND', font: 'FONT', transition: 'TRANSITION (how cards arrive and leave)' };
const MODE_SHORT = { live: 'LIVE', ambient: 'AMBIENT', art: 'ART' };
let S = {}, C = {}, D = {}, focusHelp = null, pending = {}, timer = null, busy = false, cleared = false;
// what each DEFAULT key puts back. Mode stays as it is: switching to live would start showing real tool calls
const GROUPS = { select: ['palette', 'rain', 'font', 'transition'], motion: Object.keys(FADERS),
                 privacy: [...Object.keys(SWITCHES), 'label'] };
const THEME_OWNS = [...GROUPS.select, ...GROUPS.motion];   // a new theme starts clean: no tweaks carried over
const GROUP_HELP = {
  select: ['COLORS · BACKDROP · FONT · ARRIVAL', 'back to what the theme comes with. Mode stays as it is.'],
  motion: ['TYPING · LINGER · CARDS · MOTION · GLASS', 'back to the standard values.'],
  privacy: ['CALLS ONLY · MASKS · LABEL', 'back to the safe defaults: user name and emails masked, the stock label.'],
};
const differs = k => D[k] !== undefined && S[k] !== D[k];

// ---------- words: what each option is, said once, plainly
const clean = t => String(t || '').replace(/^extra: /, '');
function optName(kind, v) { return v === 'theme' ? 'AUTO' : kind === 'mode' ? MODE_SHORT[v] || v : v.toUpperCase(); }
function optText(kind, v) {
  if (kind === 'theme') return clean(C.theme[v]);
  if (kind === 'mode') return C.mode[v][0].toUpperCase() + C.mode[v].slice(1) + '.';
  if (v === 'theme') {
    const t = S.theme;
    if (kind === 'palette') return `Follows the theme: ${t}'s own, ${C.palette[t] || ''}.`;
    return `Follows the theme: the ${{ rain: 'background', font: 'fonts', transition: 'transition' }[kind]} ${t} comes with.`;
  }
  if (kind === 'palette') return `Borrows ${v}'s colors: ${C.palette[v]}.`;
  if (kind === 'font') {
    const d = C.font[v];
    if (/system font/.test(d)) return `${d.replace(/ \(.*/, '')}: uses the copy on your system, so it may look different elsewhere.`;
    const m = d.match(/^(.*?) \(bundled(?:; (.*))?\)$/);
    return m ? (m[2] ? `${m[1]}, ${m[2]}.` : `${m[1]}.`) : d;
  }
  const d = C[kind][v]; return d ? d[0].toUpperCase() + d.slice(1) + '.' : '';
}
function say(l1, l2, bad) {
  const [a, b] = $('readout').children;
  a.textContent = l1; b.textContent = l2 || ''; b.className = 'l2' + (bad ? ' err' : '');
}
function help(h) {
  focusHelp = h || focusHelp;
  h = focusHelp;
  if (!h || !S.theme) return;
  const [kind, extra] = h.split(':');
  if (kind === 'pause') return say(S.paused ? 'PAUSE · ON' : 'PAUSE · OFF', S.paused ? 'The wallpaper shows nothing at all until you resume. Safe to stream.' : 'Press before you stream or share your screen: the wallpaper goes blank at once.');
  if (kind === 'sound') return say(`SOUND · ${muted ? 'OFF' : 'ON'}`, 'Clicks and clacks in this window as you turn and flip things. Never on the wallpaper. M toggles it.');
  if (kind === 'label') return say('CORNER LABEL', 'The text in the bottom-right corner of the wallpaper. Enter saves it.');
  if (kind === 'theme') { const v = extra || S.theme; return say(`THEME · ${v.toUpperCase()}${v === S.theme ? '' : '  (CLICK TO PICK)'}`,
                          optText('theme', v) + (cleared && v === S.theme ? ' Earlier tweaks cleared: the theme starts as it comes.' : '')); }
  if (kind === 'resetall') return say(armed ? 'RESET ALL · PRESS AGAIN' : 'RESET ALL',
    armed ? 'Press again within 4 seconds to reset. Anything else cancels it.'
          : 'Frozen or stuck? Every setting back to the default, wallpaper restarted fresh. Mode and pause stay. Window stuck too? Run: glitchwall reset');
  if (kind === 'reset') { const [a, b] = GROUP_HELP[extra]; return say(`DEFAULT · ${extra.toUpperCase()}`, `${a}: ${b}`); }
  if (FADERS[kind]) return say(`${FADERS[kind][0]} · ${S[kind]}`, FADERS[kind][1]);
  if (SWITCHES[kind]) return say(`${SWITCHES[kind][0]} · ${S[kind] ? 'ON' : 'OFF'}`, SWITCHES[kind][1]);
  if (KNOB_HELP[kind]) return say(`${KNOB_HELP[kind]} · ${optName(kind, S[kind])}`, optText(kind, S[kind]));
}

// ---------- talking to the feed: changes show at once and go out together
async function api(changes) {
  const r = await fetch(API, changes ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(changes) } : {});
  if (!r.ok) throw new Error(r.status === 403 ? 'Refused: open this with glitchwall settings.' : 'Feed error ' + r.status + '.');
  return r.json();
}
// peek: while you change something the window fades nearly away, so the real wallpaper behind it is the preview;
// it comes back a moment after you stop. Only in the settings window (pywebview); a browser tab stays as it is.
let peekTimer = null;
const winFade = to => { try { const a = window.pywebview && window.pywebview.api; if (a && a.fade) a.fade(to); } catch {} };
function peek() {
  if (!peekTimer) winFade(0.12);
  clearTimeout(peekTimer);
  const back = () => { if (busy) { peekTimer = setTimeout(back, 300); return; } peekTimer = null; winFade(1); };
  peekTimer = setTimeout(back, 1300);
}
function set(k, v, now) {
  if (S[k] !== v && SOUND_OF(k)) snd(SOUND_OF(k));
  if (S[k] !== v && k !== 'paused' && k !== 'label') peek();
  if (k === 'theme' && v !== S.theme) {   // a new theme: drop the tweaks made under the old one
    cleared = cleared || THEME_OWNS.some(differs);
    for (const x of THEME_OWNS) if (differs(x)) { S[x] = D[x]; pending[x] = D[x]; }
  } else if (k !== 'paused') cleared = false;
  S[k] = v; pending[k] = v; render(); help();
  clearTimeout(timer); timer = setTimeout(flush, now ? 0 : 220);
}
async function flush() {
  const ch = pending; pending = {};
  if (!Object.keys(ch).length) return;
  try {
    const d = await api(ch);
    if (!Object.keys(pending).length) { S = d.settings; render(); }
    if (d.refused && d.refused.length) say('NOT SAVED', d.refused.join(', '), true);
    led('feed', 'g');
  } catch (e) { led('feed', 'r'); say('NO CONNECTION', String(e.message || e), true); }
}
function led(id, c) { $('led-' + id).className = 'led ' + (c || ''); }

// ---------- building the machine
function knob(kind, name) {   // a rotor: up/down (or the wheel, a drag, a click) turns it a notch
  const b = document.createElement('button'); b.className = 'knob'; b.dataset.help = kind;
  b.innerHTML = `<div class="name"></div><div class="rotor"><div class="win"><span class="val"></span></div><div class="wheel"></div></div>`;
  b.querySelector('.name').textContent = name;
  const opts = () => Object.keys(C[kind]);
  const step = d => { const o = opts(); const i = Math.max(0, o.indexOf(S[kind])); set(kind, o[Math.min(o.length - 1, Math.max(0, i + d))]); };
  b.addEventListener('keydown', e => {
    const d = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 }[e.key];
    if (d) { e.preventDefault(); step(d); }
    if (e.key === 'Home' || e.key === 'End') { e.preventDefault(); const o = opts(); set(kind, e.key === 'Home' ? o[0] : o[o.length - 1]); }
  });
  b.addEventListener('click', e => {   // a click (or space/enter) turns it one notch on; shift turns it back
    if (!b.dragged) { const o = opts(); const i = o.indexOf(S[kind]); set(kind, o[(i + (e.shiftKey ? o.length - 1 : 1)) % o.length]); }
    b.dragged = false;
  });
  b.addEventListener('wheel', e => { e.preventDefault(); step(e.deltaY < 0 ? 1 : -1); }, { passive: false });
  b.addEventListener('pointerdown', e => {
    let y0 = e.clientY; b.dragged = false;
    const mv = ev => { if (Math.abs(ev.clientY - y0) > 12) { step(ev.clientY < y0 ? 1 : -1); y0 = ev.clientY; b.dragged = true; } };
    const up = () => { removeEventListener('pointermove', mv); removeEventListener('pointerup', up); };
    addEventListener('pointermove', mv); addEventListener('pointerup', up);
  });
  return b;
}
function fader(kind) {
  const [lo, hi] = C.ranges[kind];
  const b = document.createElement('div'); b.className = 'fader'; b.tabIndex = 0; b.dataset.help = kind;
  b.setAttribute('role', 'slider'); b.setAttribute('aria-label', FADERS[kind][0]); b.setAttribute('aria-valuemin', lo); b.setAttribute('aria-valuemax', hi);
  b.innerHTML = `<div class="name"></div><div class="track"><div class="ticks"></div><div class="slotv"></div><div class="capf"></div></div><div class="val"></div>`;
  b.querySelector('.name').textContent = FADERS[kind][0];
  const clamp = v => Math.min(hi, Math.max(lo, Math.round(v)));
  b.addEventListener('keydown', e => {
    const big = Math.max(1, Math.round((hi - lo) / 5));
    const d = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1, PageUp: big, PageDown: -big }[e.key];
    if (d) { e.preventDefault(); set(kind, clamp(S[kind] + d)); }
    if (e.key === 'Home') { e.preventDefault(); set(kind, lo); }
    if (e.key === 'End') { e.preventDefault(); set(kind, hi); }
  });
  const tr = b.querySelector('.track');
  const at = x => { const r = tr.getBoundingClientRect(); return clamp(lo + (x - r.left - 4) / (r.width - 8) * (hi - lo)); };
  tr.addEventListener('pointerdown', e => {
    e.preventDefault(); b.focus(); busy = true; tr.setPointerCapture(e.pointerId); set(kind, at(e.clientX));
    const mv = ev => { const v = at(ev.clientX); if (v !== S[kind]) set(kind, v); };
    const up = () => { busy = false; tr.removeEventListener('pointermove', mv); tr.removeEventListener('pointerup', up); };
    tr.addEventListener('pointermove', mv); tr.addEventListener('pointerup', up);
  });
  b.addEventListener('wheel', e => { e.preventDefault(); set(kind, clamp(S[kind] + (e.deltaY < 0 ? 1 : -1))); }, { passive: false });
  return b;
}
function sw(kind) {
  const b = document.createElement('button'); b.className = 'sw'; b.dataset.help = kind; b.setAttribute('role', 'switch');
  b.innerHTML = `<span class="led"></span><span class="slot"><span class="lever"></span></span><span class="name"></span>`;
  b.querySelector('.name').textContent = SWITCHES[kind][0];
  b.addEventListener('click', () => set(kind, !S[kind], true));
  return b;
}
const THEMES = () => Object.keys(C.theme);
function turnDrum(d) { const o = THEMES(), i = Math.max(0, o.indexOf(S.theme)); set('theme', o[(i + d + o.length * 4) % o.length]); }
function drum() {   // the theme drum: ←/→, the wheel, a sideways drag or a click on a neighbor turns it; it wraps around
  const dr = $('drum');
  for (const t of THEMES()) {
    const it = document.createElement('div'); it.className = 'item'; it.dataset.v = t; it.dataset.help = 'theme:' + t; it.setAttribute('role', 'option');
    it.textContent = t.toUpperCase();
    dr.appendChild(it);
  }
  dr.addEventListener('keydown', e => {
    const d = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
    if (d) { e.preventDefault(); turnDrum(d); }
  });
  dr.addEventListener('wheel', e => { e.preventDefault(); turnDrum((e.deltaY || e.deltaX) > 0 ? 1 : -1); }, { passive: false });
  dr.addEventListener('pointerdown', e => {
    let x0 = e.clientX, moved = false; dr.setPointerCapture(e.pointerId); busy = true;
    const mv = ev => { if (Math.abs(ev.clientX - x0) > 46) { turnDrum(ev.clientX < x0 ? 1 : -1); x0 = ev.clientX; moved = true; } };
    const up = ev => {
      busy = false; dr.removeEventListener('pointermove', mv); dr.removeEventListener('pointerup', up);
      if (!moved) { const it = document.elementsFromPoint(ev.clientX, ev.clientY).find(n => n.classList && n.classList.contains('item'));
                    if (it && it.dataset.v !== S.theme) set('theme', it.dataset.v, true); }
    };
    dr.addEventListener('pointermove', mv); dr.addEventListener('pointerup', up);
  });
}

// ---------- sound: made on the spot (Web Audio), no files; a lever in the header turns it off
let AC = null, muted = false, lastTick = 0;
try { muted = localStorage.getItem('gw-sound') === 'off'; } catch {}
function noise(t, dur, type, freq, q, gain) {
  const len = Math.ceil(AC.sampleRate * dur), buf = AC.createBuffer(1, len, AC.sampleRate), ch = buf.getChannelData(0);
  for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  const src = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  src.buffer = buf; f.type = type; f.frequency.value = freq; f.Q.value = q; g.gain.value = gain;
  src.connect(f).connect(g).connect(AC.destination); src.start(t);
}
function tone(t, f0, f1, dur, gain) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur);
}
function snd(kind) {
  if (muted) return;
  try {
    AC = AC || new AudioContext();
    const t = AC.currentTime;
    if (kind === 'tick') { if (performance.now() - lastTick < 35) return; lastTick = performance.now(); noise(t, .012, 'highpass', 3500, .7, .12); }
    if (kind === 'click') { noise(t, .03, 'bandpass', 2600, 3, .5); noise(t + .018, .02, 'bandpass', 1700, 3, .25); }   // a detent, then its echo
    if (kind === 'drum') { noise(t, .04, 'bandpass', 1500, 2.5, .55); tone(t, 260, 140, .05, .08); }
    if (kind === 'clack') { noise(t, .05, 'lowpass', 1400, 1, .7); tone(t, 190, 90, .07, .25); }
    if (kind === 'thunk') { tone(t, 120, 45, .16, .55); noise(t, .06, 'lowpass', 700, 1, .6); }
  } catch {}
}
const SOUND_OF = k => k === 'theme' ? 'drum' : k === 'paused' ? 'thunk' : SWITCHES[k] ? 'clack' : FADERS[k] ? 'tick' : KNOB_HELP[k] ? 'click' : null;
function toggleSound() {
  muted = !muted;
  try { localStorage.setItem('gw-sound', muted ? 'off' : 'on'); } catch {}
  snd('clack'); render(); help('sound');
}
// RESET ALL: two presses (the first arms it for 4 s), then defaults and a fresh wallpaper
let armed = false, armTimer = null;
function disarm() { armed = false; clearTimeout(armTimer); $('resetall').classList.remove('armed'); $('resetall-t').textContent = 'RESET ALL'; led('reset', ''); }
async function resetAll() {
  if (!armed) {
    armed = true; snd('click'); $('resetall').classList.add('armed'); $('resetall-t').textContent = 'PRESS AGAIN'; led('reset', 'a');
    armTimer = setTimeout(() => { disarm(); help(); }, 4000); return help('resetall');
  }
  disarm(); snd('thunk'); busy = true; pending = {}; clearTimeout(timer);
  say('RESETTING…', 'Settings back to the defaults.');
  try {
    const d = await api({ reset: true }); S = d.settings; cleared = false; render();
    if ((d.refused || []).includes('reset')) { busy = false; return say('RESET NOT AVAILABLE', 'This feed is an older version. Run: glitchwall reset', true); }
    if (!d.restarting) { busy = false; return say('RESET DONE', 'Every setting is back to the default.'); }
    say('RESTARTING THE WALLPAPER…', 'A fresh start: it will be back in a few seconds.'); led('feed', 'a');
    await new Promise(r => setTimeout(r, 2000));   // the old feed lets go first
    for (let i = 0; i < 40; i++) {
      try { const e = await api(); S = e.settings; break; } catch { await new Promise(r => setTimeout(r, 500)); }
    }
    render(); led('feed', 'g');
    say('RESET DONE', 'Every setting is back to the default and the wallpaper restarted fresh.');
  } catch (e) { led('feed', 'r'); say('RESET FAILED', String(e.message || e) + ' Try: glitchwall reset', true); }
  busy = false;
}
function resetGroup(g) {
  const keys = GROUPS[g].filter(differs);
  if (!keys.length) return help('reset:' + g);
  snd('thunk'); peek();
  for (const k of keys) { S[k] = D[k]; pending[k] = D[k]; }
  render(); help('reset:' + g);
  clearTimeout(timer); timer = setTimeout(flush, 0);
}
function build() {
  const kn = $('knobs'); KNOBS.forEach(([k, n]) => kn.appendChild(knob(k, n)));
  const fd = $('faders'); Object.keys(FADERS).forEach(k => fd.appendChild(fader(k)));
  const sws = $('switches'); Object.keys(SWITCHES).forEach(k => sws.appendChild(sw(k)));
  drum();
  $('pause').addEventListener('click', () => set('paused', !S.paused, true));
  $('snd').addEventListener('click', toggleSound);
  $('resetall').addEventListener('click', resetAll);
  document.addEventListener('pointerdown', e => { if (armed && !e.target.closest('#resetall')) disarm(); }, true);
  document.addEventListener('keydown', e => { if (armed && e.target.id !== 'resetall') disarm(); }, true);
  document.querySelectorAll('.reset').forEach(b => b.addEventListener('click', () => resetGroup(b.dataset.group)));
  // one control back to its default: Backspace/Delete on it, or a double-click
  const one = el => { const k = el && el.closest('[data-help]') && el.closest('[data-help]').dataset.help;
                      if (k && D[k] !== undefined && k !== 'mode' && k !== 'label' && differs(k)) { set(k, D[k], true); return true; } };
  document.addEventListener('dblclick', e => { if (e.target.closest('.fader, .knob')) one(e.target); });
  $('label').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } e.stopPropagation(); });
  $('label').addEventListener('change', e => set('label', e.target.value, true));
  // the tape explains whatever is under the mouse or has the keyboard
  document.addEventListener('focusin', e => { const h = e.target.closest('[data-help]'); if (h) help(h.dataset.help); });
  document.addEventListener('mouseover', e => { const h = e.target.closest('[data-help]'); if (h) help(h.dataset.help); });
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'p' || e.key === 'P') { e.preventDefault(); set('paused', !S.paused, true); }
    if (e.key === 'm' || e.key === 'M') { e.preventDefault(); toggleSound(); }
    if (e.key === 'Backspace' || e.key === 'Delete') { e.preventDefault(); one(document.activeElement); }
  });
}

function render() {
  document.querySelectorAll('.knob').forEach(b => {
    const kind = b.dataset.help, o = Object.keys(C[kind]), i = Math.max(0, o.indexOf(S[kind]));
    const val = b.querySelector('.val'); val.textContent = optName(kind, S[kind]);
    for (let px = 18; px >= 12; px--) { val.style.fontSize = px + 'px'; if (val.scrollWidth <= val.clientWidth) break; }   // long names shrink to fit
    b.querySelector('.wheel').style.backgroundPosition = `0 ${i * 5}px, 0 0`;   // the ridges roll as it turns
    b.setAttribute('aria-label', `${KNOB_HELP[kind]}: ${S[kind]}`);
  });
  document.querySelectorAll('.fader').forEach(b => {
    const kind = b.dataset.help, [lo, hi] = C.ranges[kind];
    b.querySelector('.val').textContent = S[kind];
    b.querySelector('.capf').style.left = `calc(4px + ${(S[kind] - lo) / (hi - lo)} * (100% - 8px))`;
    b.setAttribute('aria-valuenow', S[kind]);
  });
  document.querySelectorAll('.sw').forEach(b => {
    const on = !!S[b.dataset.help];
    b.classList.toggle('on', on); b.setAttribute('aria-checked', on);
    b.querySelector('.led').className = 'led ' + (on ? 'g' : '');
  });
  const items = [...$('drum').querySelectorAll('.item')], n = items.length, si = Math.max(0, THEMES().indexOf(S.theme));
  items.forEach((it, j) => {   // each theme's place on the drum: the shortest way round from the current one
    let d = ((j - si) % n + n) % n; if (d > n / 2) d -= n;
    const a = Math.abs(d);
    it.style.transform = `translateX(${d * 118}px) perspective(500px) rotateY(${-d * 24}deg) scale(${1 - Math.min(a, 3) * .1})`;
    it.style.opacity = a > 2 ? 0 : 1 - a * .35;
    it.classList.toggle('sel', d === 0); it.setAttribute('aria-selected', d === 0);
  });
  $('drumpos').textContent = `${String(si + 1).padStart(2, '0')} / ${String(n).padStart(2, '0')}`;
  document.querySelectorAll('.knob, .fader, .sw').forEach(b => b.classList.toggle('changed', b.dataset.help !== 'mode' && differs(b.dataset.help)));
  document.querySelectorAll('.reset').forEach(b => b.classList.toggle('live', GROUPS[b.dataset.group].some(differs)));
  $('led-snd').className = 'led ' + (muted ? '' : 'g');
  if (document.activeElement !== $('label')) $('label').value = S.label || '';
  $('pause').classList.toggle('on', !!S.paused);
  $('pause-t').textContent = S.paused ? 'PAUSED' : 'PAUSE';
  $('pause-s').textContent = S.paused ? 'PRESS TO RESUME' : 'STREAM-SAFE';
  led('air', S.paused ? 'a' : 'g'); $('air').textContent = S.paused ? 'PAUSED' : `ON AIR · ${MODE_SHORT[S.mode] || S.mode}`;
}

document.fonts.ready.then(() => { if (S.theme) render(); });   // sizes measured with the real fonts

(async () => {
  if (!KEY) { say('NO KEY', 'Open this with: glitchwall settings', true); return; }
  try {
    const d = await api(); S = d.settings; C = { ...d.choices, ranges: d.ranges }; D = d.defaults || {};
    $('drum').classList.add('still'); build(); render(); led('feed', 'g'); help('theme');
    requestAnimationFrame(() => requestAnimationFrame(() => $('drum').classList.remove('still')));
  } catch (e) { led('feed', 'r'); say('FEED NOT REACHABLE', String(e.message || e), true); return; }
  setInterval(async () => {   // follow changes made elsewhere (the command line, another window)
    if (busy || Object.keys(pending).length) return;
    try {
      const d = await api(); led('feed', 'g');
      if (JSON.stringify(d.settings) !== JSON.stringify(S)) { S = d.settings; render(); help(); }
    } catch { led('feed', 'r'); }
  }, 3000);
})();
</script>
</body></html>
