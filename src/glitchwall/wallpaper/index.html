<!doctype html>
<html><head><meta charset="utf-8"><title>glitchwall</title>
<style>
  @font-face { font-family:'Departure Mono'; src:url('DepartureMono-Regular.otf') format('opentype'); font-display:block; }
  @font-face { font-family:'VT323'; src:url('fonts/VT323-Regular.ttf'); font-display:block; }
  @font-face { font-family:'IBM Plex Mono'; src:url('fonts/IBMPlexMono-Regular.ttf'); font-display:block; }
  @font-face { font-family:'Chakra Petch'; src:url('fonts/ChakraPetch-Regular.ttf'); font-display:block; }
  @font-face { font-family:'Doto'; src:url('fonts/Doto.ttf'); font-weight:100 900; font-display:block; }
  @font-face { font-family:'Saira Stencil One'; src:url('fonts/SairaStencilOne-Regular.ttf'); font-display:block; }
  @font-face { font-family:'Instrument Serif'; src:url('fonts/InstrumentSerif-Regular.ttf'); font-display:block; }
  @font-face { font-family:'Courier Prime'; src:url('fonts/CourierPrime-Regular.ttf'); font-display:block; }
  @font-face { font-family:'DM Mono'; src:url('fonts/DMMono-Regular.ttf'); font-display:block; }
  @font-face { font-family:'Fira Code'; src:url('fonts/FiraCode.ttf'); font-weight:300 700; font-display:block; }
  @font-face { font-family:'Overpass Mono'; src:url('fonts/OverpassMono.ttf'); font-weight:300 700; font-display:block; }
  @font-face { font-family:'Gelasio'; src:url('fonts/Gelasio.ttf'); font-weight:400 700; font-display:block; }
  @font-face { font-family:'Caveat'; src:url('fonts/Caveat.ttf'); font-weight:400 700; font-display:block; }
  @font-face { font-family:'Cascadia Mono'; src:url('fonts/CascadiaMono.ttf'); font-weight:200 700; font-display:block; }
  @font-face { font-family:'Inconsolata'; src:url('fonts/Inconsolata.ttf'); font-weight:200 900; font-display:block; }
  @font-face { font-family:'DotGothic16'; src:url('fonts/DotGothic16-Rain.ttf'); font-display:block; }

  /* every color and font comes from the theme (THEMES below); applyLook() sets these */
  :root { --bg:#04110a; --g:#8cffb2; --s:#4fae74; --l:#ffb02e; --d:rgba(140,255,178,.3); --acc:#ffb02e;
          --err:#ff7a5c; --errd:rgba(255,122,92,.4); --errglow:none;
          --card:10,29,18; --alpha:.58; --filter:blur(14px) saturate(.5) brightness(.85);
          --bar:rgba(140,255,178,.07); --barfg:#4fae74; --barb:#8cffb2;
          --edge:rgba(140,255,178,.2); --shadow:none; --status:#4fae74; --off:#357a51;
          --scan:.42; --grain:0; --glow:none; --ghost:none; --rules:none;
          --font:'IBM Plex Mono', monospace; --mscale:1;
          --dfont:'VT323', monospace; --dscale:1; --dweight:400; }
  html, body { margin:0; height:100%; background:var(--bg); overflow:hidden; cursor:default; font-family:var(--font); }
  canvas { position:fixed; inset:0; width:100%; height:100%; }
  canvas.px { image-rendering:pixelated; }
  #status { position:fixed; right:2.5%; bottom:16px; color:var(--status); font:var(--dweight) calc(13px * var(--dscale)) var(--dfont); letter-spacing:.06em; }
  #live { width:8px; height:8px; display:inline-block; margin-right:8px; background:var(--off); }
  #live.on { background:var(--acc); box-shadow:0 0 6px var(--acc); }
  #label[data-theme]::before { content:'theme: ' attr(data-theme) '  ·  '; }   /* only in ?cycle showcase mode */

  .card { position:fixed; max-height:42vh; overflow:hidden; display:flex; flex-direction:column;
          background:rgba(var(--card),var(--alpha)); backdrop-filter:var(--filter); border:1px solid var(--edge); box-shadow:var(--shadow);
          animation:var(--ain, glitchIn .55s steps(1) both); }
  .card.bye { animation:var(--aout, glitchOut .6s linear both); }
  .bar { display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:4px 10px; background:var(--bar); color:var(--barfg);
         font:var(--dweight) calc(12px * var(--dscale)) var(--dfont); letter-spacing:.05em; border-bottom:1px solid var(--d); white-space:nowrap; text-shadow:var(--glow); }
  .bar b { color:var(--barb); font-weight:inherit; overflow:hidden; text-overflow:ellipsis; }
  .body { padding:8px 12px 10px; font-size:calc(16px * var(--mscale)); line-height:1.15; overflow:hidden; display:flex; flex-direction:column; justify-content:flex-end;
          background-image:var(--rules); background-position:0 8px; }
  .cmd, .out, .err { white-space:pre-wrap; word-break:break-word; }
  /* a tall card keeps its command; long output shrinks and shows its newest lines (typeInto scrolls it) */
  .cmd { flex-shrink:0; max-height:calc(16px * var(--mscale) * 1.15 * 9); overflow:hidden; }
  .out, .err { min-height:calc(16px * var(--mscale) * 1.15 * 2); overflow:hidden; }
  .cmd, .out { color:var(--g); text-shadow:var(--glow); }
  .cmd .p { color:var(--l); }
  .cmd .p, .bar b { text-shadow:var(--ghost); }   /* the riso misprint, on bold bits only: doubled small type reads as blur */
  .out { opacity:.82; border-left:2px solid var(--d); padding-left:10px; margin-top:6px; }
  .err { color:var(--err); text-shadow:var(--errglow); border-left:2px solid var(--errd); padding-left:10px; margin-top:6px; }
  .cur::after { content:'█'; color:var(--acc); text-shadow:var(--glow); animation:b 1s steps(1) infinite; }
  @keyframes b { 50% { opacity:0; } }

  /* pop into existence: torn slices, RGB split, jitter */
  @keyframes glitchIn {
    0%   { opacity:0; }
    8%   { opacity:1; clip-path:inset(42% 0 50% 0); transform:translate(-26px,0) skewX(18deg); filter:hue-rotate(80deg) saturate(3); text-shadow:4px 0 #ff2a55,-4px 0 #00e5ff; }
    20%  { clip-path:inset(8% 0 78% 0);  transform:translate(18px,-3px); }
    32%  { clip-path:inset(64% 0 6% 0);  transform:translate(-10px,2px) skewX(-8deg); filter:hue-rotate(-60deg); }
    44%  { clip-path:inset(20% 0 30% 0); transform:translate(6px,0); }
    56%  { clip-path:inset(0 0 0 0);     transform:translate(-3px,0); filter:none; text-shadow:2px 0 #ff2a55,-2px 0 #00e5ff; }
    72%  { transform:translate(2px,0); opacity:.85; }
    84%  { transform:none; opacity:1; text-shadow:none; }
    100% { clip-path:inset(0 0 0 0); transform:none; opacity:1; filter:none; }
  }
  /* blink out of existence: shudder, tear, collapse to a CRT line, vanish */
  @keyframes glitchOut {
    0%   { transform:none; opacity:1; }
    12%  { transform:translate(10px,0) skewX(-12deg); clip-path:inset(0 0 55% 0); filter:hue-rotate(90deg) saturate(3); text-shadow:4px 0 #ff2a55,-4px 0 #00e5ff; }
    24%  { transform:translate(-14px,0); clip-path:inset(48% 0 0 0); }
    36%  { transform:translate(4px,0); clip-path:inset(0 0 0 0); filter:brightness(2.2); }
    60%  { transform:scale(1,.02); filter:brightness(3); }
    82%  { transform:scale(.02,.02); opacity:1; }
    100% { transform:scale(0,0); opacity:0; }
  }
  /* per-theme entrances and exits (ANIMS in the script picks a pair) */
  /* crt: the beam opens to a line, then the frame; leaving, it collapses to a dot */
  @keyframes crtIn  { 0% { opacity:0; transform:scale(.5,.01); filter:brightness(3); } 35% { opacity:1; transform:scale(1,.01); filter:brightness(3); }
                      70% { transform:scale(1,1.04); filter:brightness(1.4); } 100% { transform:none; filter:none; } }
  @keyframes crtOut { 0% { transform:none; } 45% { transform:scale(1,.01); filter:brightness(2.5); } 85% { transform:scale(.02,.01); opacity:1; } 100% { transform:scale(0); opacity:0; } }
  /* draft: the top edge is ruled first, then the sheet fills down; leaving, it is erased left to right */
  @keyframes draftIn  { 0% { clip-path:inset(0 100% 99% 0); } 35% { clip-path:inset(0 0 99% 0); } 100% { clip-path:inset(0 0 0 0); } }
  @keyframes draftOut { 0% { clip-path:inset(0 0 0 0); opacity:1; } 100% { clip-path:inset(0 0 0 100%); opacity:.3; } }
  /* press: set onto the page with a soft landing; leaving, it lifts and fades */
  @keyframes pressIn  { 0% { opacity:0; transform:translateY(-12px); filter:blur(2px); } 70% { opacity:1; transform:translateY(1px); filter:none; } 100% { transform:none; } }
  @keyframes pressOut { 100% { opacity:0; transform:translateY(-8px); filter:blur(1px); } }
  /* neon: a tube catching, stuttering on; leaving, a last flicker and dark */
  @keyframes neonIn  { 0%,8%,22%,36% { opacity:0; } 4%,15% { opacity:.7; } 28% { opacity:.4; } 45%,100% { opacity:1; } }
  @keyframes neonOut { 0% { opacity:1; } 20% { opacity:.2; } 30% { opacity:.9; } 45% { opacity:.1; } 55% { opacity:.6; } 100% { opacity:0; } }
  /* stamp: comes down hard, a little crooked; leaving, it is torn off sideways */
  @keyframes stampIn  { 0% { opacity:0; transform:scale(1.25) rotate(-3deg); } 55% { opacity:1; transform:scale(.97) rotate(.6deg); } 75% { transform:scale(1.01); } 100% { transform:none; } }
  @keyframes stampOut { 100% { opacity:0; transform:translate(60px,-8px) rotate(5deg); } }
  /* riso: the second drum lands off true, then the sheet settles; leaving, it fades into the paper */
  @keyframes risoIn  { 0% { opacity:0; transform:translate(7px,5px); } 30% { opacity:.55; transform:translate(4px,3px); } 60% { opacity:1; transform:translate(-1.5px,-1px); } 100% { transform:none; } }
  @keyframes risoOut { 100% { opacity:0; transform:translate(3px,2px); filter:saturate(.3); } }
  /* sleeve: slides up out of a sleeve; leaving, slides back down */
  @keyframes sleeveIn  { 0% { opacity:0; transform:translateY(46px); } 100% { opacity:1; transform:none; } }
  @keyframes sleeveOut { 100% { opacity:0; transform:translateY(36px); } }
  /* dos: drawn in a few lines at a time, gone at once */
  @keyframes dosIn  { 0% { clip-path:inset(0 0 100% 0); } 100% { clip-path:inset(0 0 0 0); } }
  @keyframes dosOut { 0%,99% { opacity:1; } 100% { opacity:0; } }
  /* write: written in left to right; leaving, crumpled up and tossed */
  @keyframes writeIn  { 0% { clip-path:inset(0 100% 0 0); } 100% { clip-path:inset(0 0 0 0); } }
  @keyframes writeOut { 35% { transform:scale(.92) rotate(-3deg); filter:brightness(.97); } 100% { transform:translateY(50px) scale(.12) rotate(28deg); opacity:0; } }
  /* iris: opens out from the centre like an aperture, overexposed for a moment; leaving, it closes back to a point */
  @keyframes irisIn  { 0% { opacity:0; clip-path:circle(0 at 50% 50%); filter:brightness(2.4) contrast(1.4); }
                       18% { opacity:1; } 60% { filter:brightness(1.3); } 100% { clip-path:circle(75% at 50% 50%); filter:none; } }
  @keyframes irisOut { 0% { clip-path:circle(75% at 50% 50%); } 30% { filter:brightness(1.6); }
                       100% { clip-path:circle(0 at 50% 50%); opacity:.4; filter:brightness(2.4); } }
  /* eclipse: a curved shadow edge sweeps across left to right, uncovering the card; leaving, a second one covers it */
  @keyframes eclipseIn  { 0% { opacity:0; clip-path:circle(0 at -12% 50%); filter:brightness(1.8); }
                          12% { opacity:1; } 100% { clip-path:circle(170% at -12% 50%); filter:none; } }
  /* trace: swept in left to right by the beam, bright at first; leaving, it flares and fades like an afterglow */
  @keyframes traceIn  { 0% { opacity:0; clip-path:inset(0 100% 0 0); filter:brightness(2.2); } 8% { opacity:1; }
                        65% { clip-path:inset(0 0 0 0); filter:brightness(1.6); } 100% { clip-path:inset(0 0 0 0); filter:none; } }
  @keyframes traceOut { 0% { opacity:1; filter:none; } 15% { filter:brightness(1.8); } 100% { opacity:0; filter:brightness(.7) blur(2px); } }
  @keyframes eclipseOut { 0% { clip-path:circle(170% at 112% 50%); } 100% { clip-path:circle(0 at 112% 50%); opacity:.5; filter:brightness(.4); } }
  .still .card { animation:none; }

  /* oracle cards: instrument readouts with hairline corner brackets, a spaced title and one red signal mark */
  html:is([data-theme="oracle"],[data-theme="orb"]) .card { --k:color-mix(in srgb, var(--g) 55%, transparent);
    background-image:linear-gradient(var(--k),var(--k)), linear-gradient(var(--k),var(--k)), linear-gradient(var(--k),var(--k)), linear-gradient(var(--k),var(--k)),
                     linear-gradient(var(--k),var(--k)), linear-gradient(var(--k),var(--k)), linear-gradient(var(--k),var(--k)), linear-gradient(var(--k),var(--k));
    background-size:12px 1px, 1px 12px, 12px 1px, 1px 12px, 12px 1px, 1px 12px, 12px 1px, 1px 12px;
    background-position:top left, top left, top right, top right, bottom left, bottom left, bottom right, bottom right;
    background-repeat:no-repeat; background-color:rgba(var(--card),var(--alpha)); }
  html:is([data-theme="oracle"],[data-theme="orb"]) .bar { text-transform:uppercase; letter-spacing:.22em; padding:6px 12px 5px; border-bottom-color:color-mix(in srgb, var(--g) 8%, transparent); }
  html:is([data-theme="oracle"],[data-theme="orb"]) .bar b::before { content:''; display:inline-block; width:5px; height:5px; margin:0 10px 1px 0; background:var(--acc);
    box-shadow:0 0 8px var(--acc); vertical-align:middle; }
  html:is([data-theme="oracle"],[data-theme="orb"]) .body { padding:10px 14px 12px; }
  html:is([data-theme="oracle"],[data-theme="orb"]) .out { border-left-color:color-mix(in srgb, var(--g) 14%, transparent); }

  /* overlays, all static (no per-frame cost beyond compositing) */
  #grain { position:fixed; inset:0; pointer-events:none; z-index:2147483645; opacity:var(--grain); }
  html[data-mode="light"] #grain { mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/><feColorMatrix values='0 0 0 0 0.4  0 0 0 0 0.35  0 0 0 0 0.3  0 0 0 0.4 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }
  html[data-mode="dark"] #grain { mix-blend-mode:screen;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/><feColorMatrix values='0 0 0 0 0.55  0 0 0 0 0.5  0 0 0 0 0.45  0 0 0 0.4 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }
  #scan { position:fixed; inset:0; pointer-events:none; z-index:2147483647; display:none; }
  html[data-texture="scan"] #scan { display:block; animation:flick 6s infinite;
    background:repeating-linear-gradient(to bottom, transparent 0 1px, rgba(0,0,0,var(--scan)) 1px 2px); }
  /* a CRT tube: scanlines every 3px under a vignette */
  html[data-texture="tube"] #scan { display:block; animation:flick 6s infinite;
    background:repeating-linear-gradient(to bottom, rgba(0,0,0,.34) 0 1px, transparent 1px 3px),
               radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.6) 100%); }
  /* an ink halftone screen multiplied into the paper */
  html[data-texture="halftone"] #scan { display:block; mix-blend-mode:multiply; opacity:.5;
    background-image:radial-gradient(circle, var(--dot) 0.7px, transparent 1.25px); background-size:5px 5px; }
  @keyframes flick { 0%,100% { opacity:1 } 47% { opacity:1 } 48% { opacity:.86 } 49% { opacity:1 } }
</style></head>
<body>
<canvas id="c"></canvas>
<div id="status"><i id="live"></i><span id="label">live tool feed</span></div>
<div id="grain"></div>
<div id="scan"></div>
<script src="config.js"></script>
<script>
// ---------- looks: themes, backgrounds, fonts ----------
// Names here must match glitchwall/themes.py and LivelyProperties.json (a test checks).
// The first eight follow the palettes and personalities of SUB/WAVE's themes (MIT, see README).
// Per theme: mode (light/dark), bg, surface (card), ink (text), muted (bar text, status), faint,
// acc (prompt, cursor, live dot), acc2, err, display + mono font, grain 0-1, texture, glow or misreg,
// rain (default background) with its dim / hi colors. Optional overrides: bar barfg barb edge shadow status off solid filter scan.
const THEMES = {
  phosphor:   { mode:'dark',  bg:'#04110a', surface:'#0a1d12', ink:'#8cffb2', muted:'#4fae74', faint:'#357a51', acc:'#ffb02e', acc2:'#6fd3ff', err:'#ff7a5c',
                display:'vt323', mono:'plex', grain:.06, texture:'tube', glow:true, rain:'pixel', dim:'#1f6b40', hi:'#8cffb2' },
  drafting:   { mode:'dark',  bg:'#0a3a92', surface:'#0f409c', ink:'#f4f7ff', muted:'#b7c6ec', faint:'#7f92c6', acc:'#3fa9ff', acc2:'#8fd4ff', err:'#ffb3a8',
                display:'chakra', mono:'plex', grain:.08, texture:'none', rain:'draft', dim:'#b7c6ec', hi:'#f4f7ff', solid:.72 },
  newsprint:  { mode:'light', bg:'#f3efe6', surface:'#fdfbf4', ink:'#161412', muted:'#6d675e', faint:'#a8a096', acc:'#ee343b', acc2:'#236b8f', err:'#ee343b',
                display:'georgia', mono:'dmmono', grain:.4, texture:'none', rain:'none', dim:'#d9d2c4', hi:'#a8a096' },
  nightprint: { mode:'dark',  bg:'#100e0c', surface:'#1b1815', ink:'#ece6dc', muted:'#c1c0bd', faint:'#8a837a', acc:'#ee343b', acc2:'#69aed5', err:'#ff6a5c',
                display:'georgia', mono:'dmmono', grain:.25, texture:'none', rain:'none', dim:'#3a342e', hi:'#8a837a', solid:.82 },
  neon:       { mode:'dark',  bg:'#08080d', surface:'#101019', ink:'#a8f0ff', muted:'#5b6a8a', faint:'#47566f', acc:'#ff3ada', acc2:'#9850ff', err:'#ff5c8a',
                display:'doto', mono:'fira', grain:.12, texture:'scan', scan:.3, glow:true, rain:'code', dim:'#4a2a8c', hi:'#ff3ada' },
  fieldops:   { mode:'light', bg:'#d4c8a9', surface:'#dccfb0', ink:'#161009', muted:'#463c2e', faint:'#78694f', acc:'#ff6201', acc2:'#a84408', err:'#c42a00',
                display:'stencil', mono:'overpass', grain:.08, texture:'none', rain:'draft', dim:'#ff6201', hi:'#161009', solid:.86 },
  duplicator: { mode:'light', bg:'#f3eee1', surface:'#f8f4ea', ink:'#1f45c2', muted:'#4f62a8', faint:'#6f7db8', acc:'#f02d84', acc2:'#00838a', err:'#f02d84',
                display:'dmmono', mono:'dmmono', grain:.08, texture:'halftone', misreg:true, rain:'halftone', dim:'#1f45c2', hi:'#f02d84', solid:.84 },
  sleeve:     { mode:'light', bg:'#efe4cf', surface:'#f7efdf', ink:'#2a1a10', muted:'#8a6f55', faint:'#b09a7e', acc:'#c58b18', acc2:'#a04130', err:'#a04130',
                display:'serif', mono:'courierprime', grain:.4, texture:'none', rain:'record', dim:'#2a1a10', hi:'#c58b18', solid:.86 },
  // extras
  matrix:     { mode:'dark',  bg:'#0C0E0C', surface:'#2c302c', ink:'#00FF41', muted:'#7DFF9E', faint:'#2a3a2c', acc:'#C8FFD4', acc2:'#7DFF9E', err:'#ff8a7a',
                display:'departure', mono:'departure', grain:0, texture:'scan', scan:.42, glow:true, rain:'cascade', dim:'#0f6b28', hi:'#7DFF9E',
                bar:'rgba(6,42,15,.55)', status:'#3d8f55', edge:'rgba(0,255,65,.22)' },
  amber:      { mode:'dark',  bg:'#0d0a05', surface:'#30281c', ink:'#FFB000', muted:'#FFCC66', faint:'#3a2e1a', acc:'#FFE4B0', acc2:'#FFCC66', err:'#ff6a5a',
                display:'departure', mono:'departure', grain:0, texture:'scan', scan:.42, glow:true, rain:'pixel', dim:'#8a5f08', hi:'#FFCC66',
                bar:'rgba(50,32,0,.55)', status:'#9a6d10' },
  synthwave:  { mode:'dark',  bg:'#12002b', surface:'#240a46', ink:'#ff71ce', muted:'#01cdfe', faint:'#2a1a44', acc:'#fffb96', acc2:'#01cdfe', err:'#ff5c7a',
                display:'departure', mono:'departure', grain:0, texture:'scan', scan:.3, glow:true, rain:'grid', dim:'#b967ff', hi:'#01cdfe',
                bar:'rgba(1,205,254,.14)', status:'#8a5fd0', edge:'rgba(255,113,206,.4)' },
  msdos:      { mode:'dark',  bg:'#0000AA', surface:'#0000AA', ink:'#AAAAAA', muted:'#0000AA', faint:'#000066', acc:'#FFFF55', acc2:'#55FFFF', err:'#FF5555',
                display:'vt323', mono:'vt323', grain:0, texture:'scan', scan:.18, rain:'none', dim:'#5555FF', hi:'#FFFFFF', solid:1,
                bar:'#AAAAAA', barb:'#000000', edge:'#AAAAAA', shadow:'8px 8px 0 rgba(0,0,0,.65)', filter:'none', status:'#AAAAAA', line:'#5555FF' },
  // the old blue screen: white VGA text straight on blue, a grey title chip, a stop screen behind
  bsod:       { mode:'dark',  bg:'#0000AA', surface:'#0000AA', ink:'#FFFFFF', muted:'#AAAAAA', faint:'#5555FF', acc:'#FFFFFF', acc2:'#AAAAAA', err:'#FFFF55',
                display:'vt323', mono:'vt323', grain:0, texture:'scan', scan:.12, rain:'stop', dim:'#AAAAAA', hi:'#FFFFFF', solid:1,
                bar:'#AAAAAA', barfg:'#0000AA', barb:'#0000AA', edge:'rgba(170,170,170,.45)', shadow:'none', filter:'none', line:'rgba(255,255,255,.35)' },
  // blueprint's older cousin: a sun print in Prussian blue, paper grain, pale cyan
  cyanotype:  { mode:'dark',  bg:'#14376b', surface:'#1a4179', ink:'#eaf1f8', muted:'#a9bfd9', faint:'#6f8fb8', acc:'#9fd8f5', acc2:'#ffffff', err:'#ffd0c0',
                display:'serif', mono:'plex', grain:.35, texture:'none', rain:'print', dim:'#a9bfd9', hi:'#eaf1f8', solid:.7 },
  // a school notebook: ruled paper, red margin, ballpoint-blue handwriting, pencil doodles in the margins
  notebook:   { mode:'light', bg:'#fbf9f1', surface:'#fffef8', ink:'#22337a', muted:'#5d6b9a', faint:'#a9b4d0', acc:'#d64545', acc2:'#6e6e6e', err:'#d64545',
                display:'hand', mono:'hand', grain:.22, texture:'none', rain:'notebook', dim:'#9ec1e3', hi:'#707070', solid:.94, rules:true,
                bar:'rgba(214,69,69,.05)', edge:'rgba(0,0,0,.08)', shadow:'0 3px 12px rgba(0,0,0,.12)', filter:'none' },

  const h = Math.min(innerHeight * 0.42, 220);
  let best = null, bestHit = Infinity;
  // live cards by their real size (plus a gap), so blocks sit side by side instead of on top of each other
  // offset* is layout size: unlike getBoundingClientRect it is not shrunk by a card's entry animation (scale/clip)
  // and at least 160px tall: a card that only has its command so far grows when the tool output arrives
  const rects = open.map(o => ({ x: o.offsetLeft - 14, y: o.offsetTop - 14, w: o.offsetWidth + 28, h: Math.max(o.offsetHeight, 160) + 28 }));
  for (let k = 0; k < 80; k++) {
    const x = 16 + Math.random() * (innerWidth - w - 32), y = 64 + Math.random() * (innerHeight - h - 120);
    let hit = 0;
    rects.forEach(r => {
      hit += Math.max(0, Math.min(x + w, r.x + r.w) - Math.max(x, r.x)) * Math.max(0, Math.min(y + h, r.y + r.h) - Math.max(y, r.y)); });
    if (hit < bestHit) { bestHit = hit; best = { x, y }; }
    if (!hit) break;
  }
  card._rect = { x: best.x, y: best.y, w, h };
  card.style.left = best.x + 'px'; card.style.top = best.y + 'px'; card.style.zIndex = ++z;
  card.style.maxHeight = Math.min(innerHeight * 0.42, innerHeight - best.y - 52) + 'px';   // never grows over the corner label
}
function kill(card) {
  if (!card || card._dead) return; card._dead = true;
  const i = open.indexOf(card); if (i >= 0) open.splice(i, 1);
  card.classList.add('bye');
  setTimeout(() => card.remove(), 650);
}
function newCard(ev) {
  while (open.length >= MAXCARDS) kill(open[0]);
  const card = document.createElement('div'); card.className = 'card';
  const t = ev.ts ? new Date(ev.ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '';
  card.innerHTML = `<div class="bar"><b></b><span>${t}</span></div><div class="body"></div>`;
  card.querySelector('b').textContent = `${ev.proj}${ev.side ? ' / agent' : ''} #${ev.session}`;
  document.body.insertBefore(card, document.getElementById('grain'));
  place(card); open.push(card);
  card._timer = setTimeout(() => kill(card), STILL ? 1e9 : 30000);     // never got output: go anyway
  return card;
}

// ---------- typing queue ----------
let since = 0, queue = [], typing = false, lastEvent = 0, current = null;
const byRef = new Map();        // tool call id -> its card
function typeInto(el, text, cps, done) {
  const node = document.createTextNode(''); el.appendChild(node); el.classList.add('cur');
  let i = 0;
  if (STILL) { node.data = text; el.classList.remove('cur'); el.scrollTop = el.scrollHeight; return setTimeout(done, 0); }
  const step = () => {
    node.data = text.slice(0, i += Math.max(1, Math.round(cps / 60)));
    el.scrollTop = el.scrollHeight;
    if (i < text.length) requestAnimationFrame(step); else { el.classList.remove('cur'); done(); }
  };
  setTimeout(step, 260);   // let the glitch-in land first
}
function next() {
  if (!queue.length) { typing = false; return; }
  typing = true;
  const ev = queue.shift(), busy = queue.length > 6;
  if (ev.kind === 'out' || ev.kind === 'err') {
    const card = byRef.get(ev.ref) || (ev.ref ? null : current);   // output goes under the command it belongs to
    byRef.delete(ev.ref);
    if (!card || card._dead) return next();
    const el = document.createElement('div'); el.className = ev.kind;
    card.querySelector('.body').appendChild(el);
    typeInto(el, ev.text, TYPE_CPS * 5, () => {
      clearTimeout(card._timer); card._timer = setTimeout(() => kill(card), busy ? 1500 : LINGER);
      setTimeout(next, 120);
    });
    return;
  }
  current = newCard(ev);
  if (ev.ref) { byRef.set(ev.ref, current); if (byRef.size > 50) byRef.delete(byRef.keys().next().value); }
  const el = document.createElement('div'); el.className = 'cmd';
  el.innerHTML = `<span class="p"></span>`; el.firstChild.textContent = (PROMPT[ev.kind] || '>') + ' ';
  current.querySelector('.body').appendChild(el);
  typeInto(el, ev.text, TYPE_CPS * (busy ? 4 : 1), () => setTimeout(next, 200));
}

const live = document.getElementById('live'), label = document.getElementById('label');
// the feed's address: config.js (Lively, other wallpaper apps), or for glitchwall's own host the page is
// served by the feed and the key comes in the address after # (never sent to any server)
const F = window.FEED || (location.hash.startsWith('#key=') && location.protocol === 'http:'
  ? { port: location.port, key: decodeURIComponent(location.hash.slice(5)) } : {});
const SCREEN = Q.get('screen'), tuned = {};
if (SCREEN) document.title = 'glitchwall screen ' + SCREEN;
const LABEL = F.label || 'live tool feed';
label.textContent = F.key ? LABEL : 'no config.js here: run  glitchwall install';
async function poll() {
  try {
    if (!F.key) throw new Error('no config.js');
    const r = await fetch(`http://127.0.0.1:${F.port}/feed?since=${since}&key=${encodeURIComponent(F.key)}` +
                          (SCREEN ? `&screen=${encodeURIComponent(SCREEN)}` : ''), { cache: 'no-store' });
    if (!r.ok) throw new Error('refused: ' + r.status);
    const data = await r.json(), evs = data.events || [];
    if (data.look) { layers.feed = data.look; applyLook(); }  // `glitchwall config --theme ...` applies live
    SLEEP = !!data.sleep;
    for (const [k, v] of Object.entries(data.tune || {}))   // `glitchwall config --linger 12` etc.
      if (!fromLively.has(k) && tuned[k] !== v) { tuned[k] = v; setProperty(k, v); }
    if (data.last < since) since = 0;                          // the feed restarted: start over
    FEED_MODE = Q.get('mode') || data.mode || 'live';
    const art = FEED_MODE === 'art';           // art mode: background only
    const text = typeof data.label === 'string' ? data.label : LABEL;
    label.textContent = data.paused ? text + '  [paused]' : text;
    document.getElementById('status').style.display = art || !label.textContent ? 'none' : '';
    if (data.paused || art) { queue.length = 0; open.slice().forEach(kill); evs.length = 0; }   // stream-safe: clear the screen now
    if (evs.length) {
      if (since === 0) evs.splice(0, Math.max(0, evs.length - 6));   // on start, replay just the last few
      since = evs[evs.length - 1].id; lastEvent = Date.now(); queue.push(...evs);
      if (queue.length > 24) queue.splice(0, queue.length - 24);   // never fall minutes behind: skip the oldest
      if (!typing) next();
    }
    live.classList.toggle('on', Date.now() - lastEvent < 60000);
  } catch { live.classList.remove('on'); }
  setTimeout(poll, 1000);
}
poll();
</script>
</body></html>
