[project]
name = "glitchwall"
version = "0.5.1"
description = "Your coding agent's tool calls as a live, glitchy retro-terminal desktop wallpaper. Local only, secrets masked, no wallpaper app needed on Windows."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "src/glitchwall/wallpaper/OFL.txt", "src/glitchwall/wallpaper/fonts/licenses/*.txt"]
requires-python = ">=3.9"
# glitchwall is Windows only; the release wheel (tools/build_release.py) carries the renderer exe and says so in its tag.
# pywebview: the settings window (WebView2).
dependencies = ["pywebview==6.2.1; sys_platform == 'win32'"]
keywords = ["wallpaper", "claude-code", "terminal", "retro", "glitch"]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
]

[project.urls]
Homepage = "https://github.com/marklesterb28/glitchwall"
Source = "https://github.com/marklesterb28/glitchwall"
Issues = "https://github.com/marklesterb28/glitchwall/issues"
Privacy = "https://github.com/marklesterb28/glitchwall/blob/main/docs/PRIVACY.md"
Releases = "https://github.com/marklesterb28/glitchwall/releases"

[project.scripts]
glitchwall = "glitchwall.cli:main"

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"
