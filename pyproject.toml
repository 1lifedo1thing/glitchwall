[project]
name = "glitchwall"
version = "0.3.0"
description = "Your coding agent's tool calls as a live, glitchy retro-terminal desktop wallpaper. Local only, secrets masked, stdlib only."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/glitchwall/wallpaper/OFL.txt"]
requires-python = ">=3.9"
dependencies = []
keywords = ["wallpaper", "lively", "claude-code", "terminal", "retro", "glitch"]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
]

[project.scripts]
glitchwall = "glitchwall.cli:main"

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"
